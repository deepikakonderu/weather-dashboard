<!-- index.html -->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Weather Dashboard
    </title>

    <!-- Google Font -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet"
        href="style.css">

</head>

<body>

    <!-- Background -->

    <div class="background"></div>

    <!-- Main Container -->

    <main class="container">

        <!-- Header -->

        <header class="header">

            <div>

                <h1>
                    ☁ Weather Dashboard
                </h1>

                <p>
                    Real-time weather updates worldwide
                </p>

            </div>

            <button id="theme-toggle">
                🌙
            </button>

        </header>

        <!-- Search Section -->

        <section class="search-section">

            <input type="text"
                id="city-input"
                placeholder="Enter city name...">

            <button id="search-btn">
                Search
            </button>

        </section>

        <!-- Loading -->

        <div id="loading">
            Loading weather...
        </div>

        <!-- Error -->

        <div id="error-message"></div>

        <!-- Weather Card -->

        <section class="weather-card">

            <!-- Top -->

            <div class="weather-top">

                <div>

                    <h2 id="city-name">
                        Hyderabad
                    </h2>

                    <p id="date"></p>

                </div>

                <i class="fa-solid fa-cloud"
                    id="weather-icon"></i>

            </div>

            <!-- Temperature -->

            <div class="temperature">

                <h1 id="temperature">
                    25°C
                </h1>

                <p id="condition">
                    Clear Sky
                </p>

            </div>

            <!-- Details -->

            <div class="weather-details">

                <!-- Humidity -->

                <div class="detail-card">

                    <i class="fa-solid fa-water"></i>

                    <h3 id="humidity">
                        60%
                    </h3>

                    <p>
                        Humidity
                    </p>

                </div>

                <!-- Wind -->

                <div class="detail-card">

                    <i class="fa-solid fa-wind"></i>

                    <h3 id="wind-speed">
                        4 km/h
                    </h3>

                    <p>
                        Wind Speed
                    </p>

                </div>

                <!-- Feels Like -->

                <div class="detail-card">

                    <i class="fa-solid fa-temperature-half"></i>

                    <h3 id="feels-like">
                        28°C
                    </h3>

                    <p>
                        Feels Like
                    </p>

                </div>

            </div>

        </section>

    </main>

    <!-- JS -->

    <script src="script.js"></script>

</body>

</html>
